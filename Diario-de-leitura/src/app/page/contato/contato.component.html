
<main class="contato" role="main">
	<header class="contato__header">
		<h1>Fale Conosco</h1>
		<p class="subtitle">Envie sua mensagem, sugestão ou dúvida. Retornaremos o mais breve possível!</p>
	</header>

	<section class="contato__formulario">
		<form aria-label="Formulário de contato">
			<label for="nome">Nome:</label>
			<input id="nome" name="nome" type="text" required placeholder="Seu nome completo" />

			<label for="email">E-mail:</label>
			<input id="email" name="email" type="email" required placeholder="seu@email.com" />

			<label for="mensagem">Mensagem:</label>
			<textarea id="mensagem" name="mensagem" rows="5" required placeholder="Digite sua mensagem..."></textarea>

			<button type="submit">Enviar</button>
		</form>
	</section>
</main>
