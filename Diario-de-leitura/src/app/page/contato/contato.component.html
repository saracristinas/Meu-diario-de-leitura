
<main class="contato" role="main">
	<header class="contato__header">
		<h1>Fale Conosco</h1>
		<p class="subtitle">Envie sua mensagem, sugestão ou dúvida. Retornaremos o mais breve possível!</p>
	</header>

	<section class="contato__formulario">
		<form #contatoForm="ngForm" (ngSubmit)="onSubmit(contatoForm)" aria-label="Formulário de contato" autocomplete="off">
			<label for="nome">Nome:</label>
			<input id="nome" name="nome" type="text" required [(ngModel)]="nome" placeholder="Seu nome completo" #nomeModel="ngModel" />
			<div *ngIf="nomeModel.invalid && nomeModel.touched" class="erro">Nome é obrigatório.</div>

			<label for="email">E-mail:</label>
			<input id="email" name="email" type="email" required [(ngModel)]="email" placeholder="seu@email.com" #emailModel="ngModel" email />
			<div *ngIf="emailModel.invalid && emailModel.touched" class="erro">E-mail válido é obrigatório.</div>

			<label for="mensagem">Mensagem:</label>
			<textarea id="mensagem" name="mensagem" rows="5" required [(ngModel)]="mensagem" placeholder="Digite sua mensagem..." #mensagemModel="ngModel"></textarea>
			<div *ngIf="mensagemModel.invalid && mensagemModel.touched" class="erro">Mensagem é obrigatória.</div>

			<button type="submit" [disabled]="contatoForm.invalid">Enviar</button>
			<div *ngIf="enviado" class="sucesso">Mensagem enviada com sucesso!</div>
		</form>
	</section>
</main>
