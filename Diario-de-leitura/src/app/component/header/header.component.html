<header class="header" role="banner">
	<div class="container">
		<a routerLink="/" class="logo" aria-label="Página inicial do Meu Diário de Leitura">
			<span>Meu Diário de Leitura</span>
		</a>
		<button
			class="menu-toggle"
			aria-label="Abrir menu de navegação"
			aria-controls="main-menu"
			[attr.aria-expanded]="isMenuOpen"
			(click)="toggleMenu()"
		>
			<span class="hamburger" aria-hidden="true"></span>
		</button>
		<nav class="nav" aria-label="Navegação principal">
			<ul
				id="main-menu"
				[class.open]="isMenuOpen"
				(click)="closeMenu()"
			>
			<li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" aria-current="page">Início</a></li>
			<li><a routerLink="/livros" routerLinkActive="active">Livros</a></li>
			<li><a routerLink="/desempenho" routerLinkActive="active">Meu Desempenho</a></li>
			<li><a routerLink="/sobre" routerLinkActive="active">Sobre</a></li>
			<li><a routerLink="/contato" routerLinkActive="active">Contato</a></li>
			</ul>
		</nav>
	</div>
</header>
